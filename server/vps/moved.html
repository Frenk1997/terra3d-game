<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Terra 3D переехала</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
         background: radial-gradient(120% 60% at 50% 0%, #17235a 0%, #060b1d 55%, #02040d 100%); color: #f4f7ff;
         font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 10px; }
  p { color: #b6c4ee; margin: 0 0 22px; }
  a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>🌍 Terra 3D переехала</h1>
  <p>Теперь игра открывается без VPN. Переходим на новый адрес…</p>
  <a id="go" href="__TO__/">Открыть игру</a>
</main>
<script>
(function () {
  // Вход и сохранение с этого адреса переносим на новый, чтобы не входить заново
  var to = '__TO__', h = '';
  try {
    var s = JSON.parse(localStorage.getItem('terra_session'));
    if (s && s.token && s.uid) {
      var d = { session: { token: s.token, uid: s.uid, nickname: s.nickname || null } };
      try { var sv = JSON.parse(localStorage.getItem('terra_save_' + s.uid)); if (sv) d.save = sv; } catch (e) {}
      h = '#move=' + encodeURIComponent(JSON.stringify(d));
    }
  } catch (e) {}
  document.getElementById('go').href = to + '/' + h;
  location.replace(to + '/' + h);
})();
</script>
</body>
</html>
