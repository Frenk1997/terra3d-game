# Собирает APK при каждом изменении игры (папка web/) или Android-проекта
# и выкладывает его в Releases. Ссылка на последнюю версию для игроков:
#   https://github.com/<ваш-логин>/<репозиторий>/releases/latest/download/terra3d.apk
name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Проверить настройки
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Нет пароля ключа::Добавьте секрет KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions). Пароль — в сообщении Claude, см. README, шаг 2."
            exit 1
          fi
          if grep -q "YOUR-SUBDOMAIN" web/config.js; then
            echo "::warning title=Демо-сборка::В web/config.js не указан адрес сервера — APK будет работать только в демо-режиме (без входа и рейтинга)."
          fi

      # Если у игры есть свой сервер (секрет VPS_HOST, см. SETUP.md) — APK ходит туда, а не на Cloudflare
      - name: Адрес сервера
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          URL="$(bash server/vps/public-url.sh)"
          if [ -n "$URL" ]; then
            if curl -fsS --max-time 15 --retry 3 "$URL/api/health" | grep -q '"terra":true'; then
              sed -i -E "s#^([[:space:]]*API_URL:).*#\1 '$URL',#" web/config.js
              echo "APK ходит на свой сервер: $URL"
            else
              echo "::warning title=Свой сервер не отвечает::$URL недоступен — APK собран со старым адресом из web/config.js. Сначала запустите сценарий «Deploy server»."
            fi
          fi
          API="$(sed -nE "s/^[[:space:]]*API_URL:[[:space:]]*'([^']*)'.*/\1/p" web/config.js | head -1)"
          echo "Сервер в APK: $API"
          echo "TERRA_API=$API" >> "$GITHUB_ENV"

      - name: Собрать APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_17_X64"; fi
          java -version
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/terra3d.apk"
          ls -la "$GITHUB_WORKSPACE/terra3d.apk"

      # Та же игра для панели под трансляцией на Twitch: zip загружается в кабинет разработчика Twitch (SETUP.md)
      - name: Панель для Twitch
        run: |
          case "$TERRA_API" in
            https://*) bash server/twitch/build.sh "$TERRA_API" terra3d-twitch.zip ;;
            *) echo "::warning::Адрес сервера не https — панель для Twitch не собрана" ;;
          esac

      - name: Описание версии для окна «Вышло обновление»
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Что нового — первая строка сообщения коммита (служебные «Update …», «Merge …» не показываем)
          export NOTES="$(git log -1 --pretty=%s)"
          python3 - <<'PY'
          import json, os, re
          n = int(os.environ["BUILD_NUMBER"])
          notes = os.environ.get("NOTES", "").strip()
          if re.match(r"^(Update|Merge|Add files|Create|Delete|Revert)\b", notes):
              notes = ""
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump({"build": n, "version": "1.0.%d" % n, "notes": notes[:300], "api": os.environ.get("TERRA_API", "")}, f, ensure_ascii=False)
          PY
          cat version.json

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          FILES=(terra3d.apk version.json)
          [ -f terra3d-twitch.zip ] && FILES+=(terra3d-twitch.zip)
          gh release create "$TAG" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Terra 3D $TAG" \
            --notes "Скачать: terra3d.apk ниже. Постоянная ссылка на последнюю версию: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/terra3d.apk. terra3d-twitch.zip — игра для панели на Twitch (загружается в кабинет разработчика Twitch, см. SETUP.md)." \
            --latest
          echo "### APK готов 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "Ссылка для игроков: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/terra3d.apk" >> "$GITHUB_STEP_SUMMARY"
