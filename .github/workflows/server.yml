# Выкладывает сервер (вход, рейтинг, сохранения) и веб-версию игры на Cloudflare.
# Пока не заданы секреты Cloudflare и Google, сценарий просто пропускается с предупреждением.
name: Deploy server

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Выложить на Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/terra3d.apk
        run: bash server/deploy.sh
